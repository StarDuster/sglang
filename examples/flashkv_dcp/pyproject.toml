[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apodex-flashkv-dcp"
version = "0.1.0"
description = "Experimental versioned DCP adapter for the PAI FlashKV client"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["apodex_flashkv*"]
